# Local: only what is needed to live without the config server (D5, degrades via optional:).
# The rest (Eureka URL, RS256 keys, JWT TTL) travels from the config server.
spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8888
  jpa:
    hibernate:
      # Never create-drop: it would wipe the data.sql seed (SQL init runs before JPA)
      ddl-auto: none

# Random port also in local mode (D3): if the config server is down, this still holds
server:
  port: 0
