# Cold test config: replaces the main application.yml (test classpath comes first).
# No config import nor Eureka => deterministic even with services running locally.
# The 4 config-server routes are replicated here to validate the namespace (4.3.x):
# spring.cloud.gateway.server.webflux.* (the legacy spring.cloud.gateway.* is deprecated).
# Each uri is a placeholder: the routes test resolves the default (lb://... exactly like
# production), while the security E2E injects a local stub URL before the context starts
# (indexed list properties do not merge across sources, so the URI cannot be overridden).
spring:
  application:
    name: gateway-server
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webflux:
          routes:
            - id: auth-token
              uri: ${gateway.stub.base-url:lb://auth-service}
              predicates:
                - Path=/api/auth/token
                - Method=POST
            - id: demo-api
              uri: ${gateway.stub.base-url:lb://demo-service}
              predicates:
                - Path=/api/demo/**
            - id: api-docs-auth-service
              uri: ${gateway.stub.base-url:lb://auth-service}
              predicates:
                - Path=/v3/api-docs/auth-service
              filters:
                - RewritePath=/v3/api-docs/auth-service, /v3/api-docs
            - id: api-docs-demo-service
              uri: ${gateway.stub.base-url:lb://demo-service}
              predicates:
                - Path=/v3/api-docs/demo-service
              filters:
                - RewritePath=/v3/api-docs/demo-service, /v3/api-docs

eureka:
  client:
    enabled: false

server:
  port: 0

