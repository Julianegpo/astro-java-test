# Local: only what is needed to live without the config server (D5, degrades via optional:).
# The lb:// routes arrive from the config server (config/gateway-server.yml of the native repo).
spring:
  application:
    name: gateway-server
  config:
    import: optional:configserver:http://localhost:8888

# Port 8080 also in local mode (D3): the client only ever sees this door
server:
  port: 8080
