# Local: only what is needed to live without the config server (D5, degrades via optional:).
# The Eureka URL arrives from the config server (shared config/application.yml of the native repo).
spring:
  application:
    name: demo-service
  config:
    import: optional:configserver:http://localhost:8888

# Random port also in local mode (D3): if the config server is down, it still holds
server:
  port: 0
